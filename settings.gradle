pluginManagement {
    repositories {
        mavenLocal()
        // Aliyun mirror of gradle plugin portal (helps in CN networks)
        maven {
            name = 'AliyunGradle'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        // Aliyun public mirror (covers central + many others)
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        // NeoForged official maven (used by moddev plugin)
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'RecipeGraph'
